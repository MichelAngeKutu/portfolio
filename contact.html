<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michel-Ange Kutu - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <p class="logo">Michel-Ange Kutu</p>
    </header>
    <!--links to all 4 pages-->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="resume.html">Resume</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" class="current">Contact</a></li>
        </ul>
    </nav>
    <main>
        <h1>Contact Me</h1>
        <p>Have a question or an opportunity? Send me a message.</p>
        <!-- Contact form -->
        <form id="contact-form">

            <div>
                <label for="fName">First name</label>
                <input type="text" id="fName" name="firstName" placeholder="First name" required>
            </div>
            <div>
                <label for="lName">Last name</label>
                <input type="text" id="lName" name="lastName" placeholder="Last name" required>
            </div>
            <div>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="John@gmail.com" required>
            </div>

            <div>
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" maxlength="100" minlength="3" required>
            </div>

            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" cols="40" maxlength="500" minlength="10"
                    required></textarea>
            </div>

            <button type="submit">Send</button>

        </form>

    </main>
    <footer>
        <p>&copy; 2026 Michel-Ange Kutu</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
